# Compile l'APK de test de Mes Finances directement sur GitHub (Gradle, sans Expo ni jeton)
# et le publie dans une « Release » GitHub, avec un lien de téléchargement direct.
#
# Signature : clé de test standard générée par `expo prebuild` (toujours la même),
# donc chaque nouvelle version GitHub s'installe par-dessus la précédente.
# Seules les valeurs PUBLIQUES de Supabase sont embarquées (URL et clé publishable, déjà dans eas.json).

name: APK Android (test)

on:
  workflow_dispatch:
  push:
    branches: [claude/finances-wallet-forecasts-otbroy]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/apk-android.yml'

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

# Actions épinglées par empreinte ; seul le job de publication peut écrire dans le dépôt.
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      # Le kit Android est déjà installé sur les serveurs GitHub (ANDROID_HOME) ;
      # Gradle télécharge lui-même les composants manquants.
      - name: Kit Android
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Installer les dépendances
        run: npm ci

      - name: Tests du moteur financier
        run: npm test -- --runInBand

      - name: Valeurs publiques de Supabase (depuis eas.json)
        run: |
          node -e "
            const env = require('./eas.json').build.preview.env;
            for (const [k, v] of Object.entries(env)) {
              if (!k.startsWith('EXPO_PUBLIC_')) throw new Error('Seules les variables publiques sont autorisées : ' + k);
              if (/sb_secret|service_role/.test(v)) throw new Error('Clé secrète interdite dans l’application');
              require('fs').appendFileSync(process.env.GITHUB_ENV, k + '=' + v + '\n');
            }"

      - name: Générer le projet Android
        run: npx expo prebuild --platform android --clean --no-install

      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Version
        id: v
        run: |
          echo "version=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/release/app-release.apk mes-finances-preview.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mes-finances-${{ steps.v.outputs.version }}-${{ github.run_number }}
          path: mes-finances-preview.apk

  publier:
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write # publier la Release avec l'APK
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mes-finances-${{ needs.apk.outputs.version }}-${{ github.run_number }}

      - name: Publier la Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: apk-${{ needs.apk.outputs.version }}-${{ github.run_number }}
          name: Mes Finances ${{ needs.apk.outputs.version }} (test n°${{ github.run_number }})
          prerelease: true
          files: mes-finances-preview.apk
          body: |
            APK de test de Mes Finances, compilé par GitHub Actions.
            Sur le téléphone : ouvrir ce lien, télécharger `mes-finances-preview.apk`, puis l'installer.
            Première installation depuis GitHub : désinstaller d'abord la version installée depuis Expo (autre signature). Les données sont sur le serveur.
